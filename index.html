<!doctype html>
<html lang="en" data-theme="sakura-flowers" style="color-scheme: light">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https://tokyo-manga-lab-api2.haribp720.workers.dev https://graphql.anilist.co https://api.mangadex.network https://*.mangadex.network https://*.mangadex.network:* https://uploads.mangadex.org; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4f7">
  <meta name="description" content="Tokyo Manga Lab — your manga library, your rules.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/screens.css">
  <link rel="stylesheet" href="./css/reader.css">
  <link rel="stylesheet" href="./css/downloads.css">
  <link rel="stylesheet" href="./css/recent.css">
  <link rel="stylesheet" href="./css/discover.css">
  <link rel="stylesheet" href="./css/updates.css">
  <link rel="stylesheet" href="./css/privacy.css">
  <title>Tokyo Manga Lab</title>
</head>
<body>
  <div class="splash" id="splash" role="status" aria-label="Opening Tokyo Manga Lab">
    <div class="splash-inner">
      <img class="splash-logo" src="./assets/icon-512.png" width="168" height="168" alt="">
      <p class="splash-name">Tokyo Manga Lab</p>
      <p class="splash-tag">Your manga. Your world.</p>
      <span class="splash-bar" aria-hidden="true"></span>
    </div>
    <p class="splash-foot">Library, reader and AniList tracking</p>
  </div>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Tokyo Manga Lab home">
        <img class="brand-mark" src="./assets/logo-96.png" width="34" height="34" alt="" decoding="async">
        <span class="brand-copy"><strong>Tokyo Manga Lab</strong><small>Your manga. Your world.</small></span>
      </a>
      <div class="topbar-actions">
        <span class="connection-pill" id="connectionStatus" role="status"><span class="status-dot"></span><span class="status-text">Connecting</span></span>
        <button class="icon-button" type="button" data-action="toggle-theme" aria-label="Switch theme" title="Switch theme"><span data-icon="moon"></span></button>
      </div>
    </header>

    <nav class="desktop-nav" aria-label="Main navigation">
      <a href="#home" data-nav="home"><span class="nav-icon" data-icon="home"></span>Home</a>
      <a href="#discover" data-nav="discover"><span class="nav-icon" data-icon="discover"></span>Discover</a>
      <a href="#library" data-nav="library"><span class="nav-icon" data-icon="library"></span>Library</a>
      <a href="#recent" data-nav="recent"><span class="nav-icon" data-icon="clock"></span>Recent</a>
      <a href="#downloads" data-nav="downloads"><span class="nav-icon" data-icon="download"></span>Downloads</a>
      <a href="#profile" data-nav="profile"><span class="nav-icon" data-icon="user"></span>Profile</a>
      <a href="#settings" data-nav="settings"><span class="nav-icon" data-icon="sliders"></span>Settings</a>
    </nav>

    <main id="appView" class="app-view" tabindex="-1">
      <div class="initial-loading"><span class="spinner"></span><p>Preparing your library…</p></div>
    </main>

    <nav class="mobile-nav" aria-label="Main navigation">
      <a href="#home" data-nav="home"><span class="nav-icon" data-icon="home"></span><small>Home</small></a>
      <a href="#discover" data-nav="discover"><span class="nav-icon" data-icon="discover"></span><small>Discover</small></a>
      <a href="#library" data-nav="library"><span class="nav-icon" data-icon="library"></span><small>Library</small></a>
      <a href="#recent" data-nav="recent"><span class="nav-icon" data-icon="clock"></span><small>Recent</small></a>
      <a href="#downloads" data-nav="downloads"><span class="nav-icon" data-icon="download"></span><small>Downloads</small></a>
      <a href="#profile" data-nav="profile"><span class="nav-icon" data-icon="user"></span><small>Profile</small></a>
    </nav>
  </div>

  <dialog id="detailsDialog" class="details-dialog" aria-labelledby="detailsTitle">
    <button class="dialog-close" type="button" data-action="close-details" aria-label="Close details">×</button>
    <div id="detailsContent"></div>
  </dialog>
  <dialog id="filterDialog" class="filter-dialog" aria-labelledby="fsTitle"></dialog>
  <dialog id="downloadDialog" class="download-dialog" aria-labelledby="dlTitle"></dialog>
  <dialog id="sheetDialog" class="details-dialog sheet-dialog" aria-labelledby="sheetTitle">
    <button class="dialog-close" type="button" data-action="sheet-close" aria-label="Close">×</button>
    <div id="sheetContent"></div>
  </dialog>
  <input id="backupFileInput" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
