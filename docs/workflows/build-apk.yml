name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      allow_random_key:
        description: "Build even without the saved signing key (the APK will NOT install over an older build)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write   # only used to attach the APK to a Release when you push a v* tag

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21 (required by Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        # With a package-lock.json in the repo the exact tested versions are installed (npm ci).
        # Without one, npm install resolves fresh versions and the lock it writes is saved as an artifact below,
        # so you can download it and commit it to make later builds repeatable.
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "No package-lock.json in the repository - resolving versions fresh."
            npm install --no-audit --no-fund
          fi

      - name: Save the generated lockfile
        if: hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore

      - name: Syntax checks and tests
        run: |
          npm run check
          npm test

      - name: Build web bundle (www/)
        run: npm run build:www

      - name: Generate Android project
        run: npx cap add android

      - name: Apply version and icon
        run: |
          VERSION_NAME="$(node -p "require('./package.json').version")"
          bash scripts/android-customize.sh "$VERSION_NAME" "${{ github.run_number }}"

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Use the saved signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using the saved signing key, so this APK installs over older builds."
          elif [ "${{ inputs.allow_random_key }}" = "true" ]; then
            echo "::warning::Building with a random signing key because you asked for it. This APK will NOT install over an older build."
          else
            echo "::error::The secret ANDROID_DEBUG_KEYSTORE_BASE64 is missing, so this APK would get a random signing key and Android would refuse to install it over your current app (\"App not installed as package conflicts with an existing package\"). Add the secret (docs/SIGNING.md) and run again. To build anyway, run the workflow by hand and tick allow_random_key."
            exit 1
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION_NAME="$(node -p "require('./package.json').version")"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Tokyo-Manga-Lab-${VERSION_NAME}-debug.apk"
          ls -lh dist

      - name: Show the signing fingerprint
        env:
          EXPECTED_SHA256: "5D:95:DD:98:36:04:94:58:F3:A7:A2:E3:F5:7A:AF:D0:22:5A:E8:45:4B:AB:D1:6D:15:F6:94:04:AE:29:2E:E2"
        run: |
          FP="$(keytool -printcert -jarfile dist/*.apk | grep -E "SHA256" | head -n 1 | sed 's/.*SHA256: *//')"
          echo "APK signing fingerprint (SHA-256): $FP"
          {
            echo "### APK signing key"
            echo ""
            echo "SHA-256: \`$FP\`"
            echo ""
            echo "An APK installs over an older one only when this value is the same. It should stay the same on every build."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FP" != "$EXPECTED_SHA256" ]; then
            echo "::warning::This APK is signed with a different key than the Tokyo Manga Lab key (expected ${EXPECTED_SHA256:0:23}...). If your phone already has a build signed with the expected key it will say 'package conflicts with an existing package'. See docs/SIGNING.md."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tokyo-Manga-Lab-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

