name: Unzip and apply ZIP

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Path of the ZIP inside the repo"
        required: true
        default: "Tokyo-Manga-Lab-APK-Kit.zip"

permissions:
  contents: write
  pull-requests: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip onto a new branch
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          python3 - <<'PY'
          import os, shutil, sys, tempfile, zipfile
          zp = os.environ["ZIP_PATH"]
          if not os.path.isfile(zp):
              sys.exit("ZIP not found: " + zp)
          tmp = tempfile.mkdtemp()
          with zipfile.ZipFile(zp) as z:
              for name in z.namelist():
                  if name.startswith("/") or ".." in name.split("/"):
                      sys.exit("Unsafe path in ZIP: " + name)
              z.extractall(tmp)
          items = os.listdir(tmp)
          src = tmp
          if len(items) == 1 and os.path.isdir(os.path.join(tmp, items[0])):
              src = os.path.join(tmp, items[0])
          for skip in [".github", ".git", "__MACOSX", "node_modules"]:
              shutil.rmtree(os.path.join(src, skip), ignore_errors=True)
          # Optional clean-up list. DELETE-FILES.txt in the ZIP names files to remove (one repository path per line,
          # anything after a # is a note, a path ending in / removes that folder). Never touches .git or .github,
          # never leaves the repository, and the list itself is not copied in.
          removed = []
          listing = os.path.join(src, "DELETE-FILES.txt")
          if os.path.isfile(listing):
              root = os.path.realpath(".")
              for raw in open(listing, encoding="utf-8").read().splitlines():
                  entry = raw.split("#", 1)[0].strip()
                  if not entry:
                      continue
                  folder = entry.endswith("/")
                  rel = entry.strip("/")
                  parts = rel.split("/")
                  target = os.path.realpath(os.path.join(root, rel))
                  if (not rel or entry.startswith("/") or ".." in parts or parts[0] in (".git", ".github")
                          or not target.startswith(root + os.sep) or os.path.islink(os.path.join(root, rel))):
                      print("Skipped unsafe entry:", entry)
                      continue
                  if folder and os.path.isdir(target):
                      shutil.rmtree(target)
                      removed.append(entry)
                  elif not folder and os.path.isfile(target):
                      os.remove(target)
                      removed.append(entry)
                  else:
                      print("Nothing to remove for:", entry)
              os.remove(listing)
          shutil.copytree(src, ".", dirs_exist_ok=True)
          if os.path.isfile(zp):
              os.remove(zp)
          print("Applied ZIP contents (skipped .github).")
          if removed:
              print("Removed:", ", ".join(removed))
          PY

      - name: Commit and push branch
        id: push
        run: |
          BRANCH="import/zip-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes: the ZIP matches the repository."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Import files from ZIP (${{ inputs.zip_path }})"
          git push origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.push.outputs.branch }}" \
            --title "Import files from ZIP" \
            --body "Files unzipped by the Unzip and apply ZIP workflow. Review the diff before merging." \
          || echo "::warning::Could not open a PR automatically. The branch ${{ steps.push.outputs.branch }} was pushed; open the PR from the Branches page."
